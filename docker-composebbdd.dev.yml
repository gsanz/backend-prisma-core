version: '3.8'

services:
  postgresql:
    image: postgres:15
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: tragsa
      POSTGRES_PASSWORD: tragsa
      POSTGRES_DB: tragsa_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tragsa -d tragsa_db']
      interval: 5s
      retries: 5
volumes:
  postgres_data:
