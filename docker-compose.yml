services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nest-api
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      # /app/dist ELIMINADO
    command: >
      sh -c "npx prisma db push && npx prisma db seed && npm run start:dev"
